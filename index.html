<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Asie 2027</title>
<meta name="theme-color" content="#0D0D1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget Asie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0D0D1F; --s1: #14142A; --s2: #1C1C38; --s3: #25254A; --bd: #2A2A4A;
  --tx: #EDEDF7; --dim: #9A9ABF; --mute: #6B6B8F;
  --ac: #E8C97A; --ac2: #F3DDA4; --ok: #2ECC71; --bad: #FF6B5E; --warn: #F5A623;
  --th: #F5A623; --vn: #2ECC71; --jp: #FF3D7F; --kr: #3D9EFF; --cn: #FF4A2A; --gen: #9A9ABF;
  --r: 16px;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--tx); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
body { padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px calc(env(safe-area-inset-bottom, 0px) + 110px); max-width: 640px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* Barre du haut */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0 14px; }
.brand { font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: .2px; }
.brand em { color: var(--ac); }
.top-actions { display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--bd); background: var(--s1); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; color: var(--dim); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; }
.pill.ok i { background: var(--ok); }
.pill.busy i { background: var(--ac); animation: pulse 1s infinite; }
.pill.wait { color: var(--warn); border-color: rgba(245,166,35,.45); }
.pill.wait i { background: var(--warn); }
.pill.err { color: var(--bad); border-color: rgba(255,107,94,.45); }
.pill.err i { background: var(--bad); }
@keyframes pulse { 50% { opacity: .3; } }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--bd); background: var(--s1); display: grid; place-items: center; color: var(--dim); }

/* Bandeaux */
.banner { background: var(--s1); border: 1px solid var(--bd); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--dim); margin-bottom: 14px; }
.banner b { color: var(--tx); }
.banner.warn { border-color: rgba(245,166,35,.45); }

/* Pays */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px 14px; padding-inline: 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--bd); background: var(--s1); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; color: var(--dim); display: inline-flex; align-items: center; gap: 7px; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--gen)); }
.chip[aria-pressed="true"] { background: var(--s3); color: var(--tx); border-color: var(--c, var(--ac)); }

/* Carte principale */
.hero { background: linear-gradient(160deg, var(--s2), var(--s1)); border: 1px solid var(--bd); border-radius: var(--r); padding: 18px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c, var(--ac)); }
.hero .kicker { font-size: 11.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.hero h1 { font-family: var(--serif); font-size: 28px; margin: 2px 0 12px; line-height: 1.15; }
.big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.big .v { font-family: var(--serif); font-size: 34px; font-weight: 700; }
.big .of { color: var(--dim); font-size: 14px; }
.bar { height: 8px; border-radius: 99px; background: var(--s3); overflow: hidden; margin: 12px 0 10px; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--ac)); transition: width .4s; }
.bar.over > span { background: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: rgba(255,255,255,.03); border: 1px solid var(--bd); border-radius: 12px; padding: 9px 10px; min-width: 0; }
.stat .l { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }
.stat .v { font-weight: 700; font-size: 16px; margin-top: 2px; }
.stat .v.bad { color: var(--bad); }
.stat .v.good { color: var(--ok); }

/* Sections */
h2 { font-family: var(--serif); font-style: italic; font-size: 20px; margin: 26px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
h2 small { font-family: var(--sans); font-style: normal; font-size: 12.5px; color: var(--dim); font-weight: 500; }
.card { background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 10px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--bd); }
.row:first-child { border-top: 0; }
.row .ico { font-size: 19px; text-align: center; }
.row .name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { grid-column: 2 / 4; font-size: 12.5px; color: var(--dim); display: flex; justify-content: space-between; gap: 10px; }
.row .amt { text-align: right; font-weight: 600; white-space: nowrap; }
.row .amt small { color: var(--dim); font-weight: 500; }
.row .bar { grid-column: 2 / 4; margin: 2px 0 0; height: 5px; }
.bad { color: var(--bad); }
.good { color: var(--ok); }

/* Hôtels */
.hotel { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px 14px; border-top: 1px solid var(--bd); align-items: center; }
.hotel:first-child { border-top: 0; }
.hotel .name { font-weight: 600; }
.hotel .meta { font-size: 12.5px; color: var(--dim); }
.hotel .right { text-align: right; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 99px; padding: 2px 9px; border: 1px solid var(--bd); color: var(--dim); }
.tag.over { color: var(--bad); border-color: rgba(255,107,94,.5); background: rgba(255,107,94,.08); }
.tag.under { color: var(--ok); border-color: rgba(46,204,113,.45); background: rgba(46,204,113,.08); }
.tag.now { color: var(--ac); border-color: rgba(232,201,122,.5); }
.tag.resv { color: var(--kr); border-color: rgba(61,158,255,.5); background: rgba(61,158,255,.08); }
.tags { display: flex; gap: 5px; justify-content: flex-end; margin-top: 2px; }
.resv-txt { color: var(--kr); }

/* Journal */
.entry { display: grid; grid-template-columns: 28px 1fr auto; gap: 2px 10px; padding: 11px 14px; border-top: 1px solid var(--bd); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.entry:first-child { border-top: 0; }
.entry .ico { font-size: 18px; text-align: center; }
.entry .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry .meta { grid-column: 2 / 3; font-size: 12px; color: var(--dim); }
.entry .amt { text-align: right; font-weight: 600; }
.entry .loc { grid-column: 3; text-align: right; font-size: 12px; color: var(--dim); }
.entry.pending .meta::after { content: ' · ⏳ pas encore envoyée'; color: var(--warn); }
.entry-actions { display: flex; gap: 8px; padding: 0 14px 12px 52px; }
.btn { border: 1px solid var(--bd); background: var(--s2); border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px; }
.btn.danger { color: var(--bad); border-color: rgba(255,107,94,.45); }
.btn.primary { background: var(--ac); color: #1A1406; border-color: var(--ac); }
.btn.wide { width: 100%; padding: 14px; font-size: 16px; }
.empty { padding: 18px 14px; color: var(--dim); font-size: 13.5px; text-align: center; }
.more { width: 100%; background: none; border: 0; border-top: 1px solid var(--bd); color: var(--ac); padding: 12px; font-weight: 600; }

/* Bouton + dépense */
.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 20; background: var(--ac); color: #1A1406; border: 0; border-radius: 999px; padding: 16px 28px; font-weight: 700; font-size: 17px; box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 0 6px rgba(13,13,31,.8); display: flex; align-items: center; gap: 8px; }
.fab span { font-size: 24px; line-height: 0; margin-top: -2px; }

/* Feuille d'ajout */
.sheet-bg { position: fixed; inset: 0; background: rgba(5,5,15,.7); z-index: 30; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--s1); border-top: 1px solid var(--bd); border-radius: 22px 22px 0 0; max-height: 92vh; overflow-y: auto; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); max-width: 640px; margin: 0 auto; }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--bd); margin: 0 auto 10px; }
.sheet h3 { font-family: var(--serif); font-size: 22px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
.amount { display: flex; gap: 8px; align-items: stretch; }
.amount input { flex: 1; min-width: 0; font-size: 34px; font-weight: 700; font-family: var(--serif); background: var(--bg); border: 1px solid var(--bd); border-radius: 14px; padding: 8px 14px; }
.amount select { width: 96px; font-size: 17px; font-weight: 600; }
.conv { color: var(--dim); font-size: 13px; margin: 6px 2px 14px; min-height: 18px; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
select, input[type=text], input[type=date], input[type=url] { width: 100%; background: var(--bg); border: 1px solid var(--bd); border-radius: 12px; padding: 12px; font-size: 16px; }
input:focus, select:focus { outline: 2px solid var(--ac); outline-offset: 1px; }
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cat { border: 1px solid var(--bd); background: var(--bg); border-radius: 12px; padding: 8px 4px; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; color: var(--dim); }
.cat b { font-size: 21px; font-weight: 400; }
.cat[aria-pressed="true"] { border-color: var(--ac); color: var(--tx); background: var(--s3); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.err-msg { color: var(--bad); font-size: 13px; min-height: 18px; margin: -6px 0 10px; }
.hint { font-size: 13px; color: var(--dim); background: var(--bg); border: 1px dashed var(--bd); border-radius: 12px; padding: 9px 12px; margin: -4px 0 14px; }
.hint b { color: var(--tx); font-weight: 600; }
.check { display: flex; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--bd); border-radius: 12px; padding: 12px; margin-bottom: 14px; font-size: 15px; }
.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--kr); flex: none; }
.check small { display: block; color: var(--dim); font-size: 12.5px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { border: 1px solid var(--bd); background: var(--bg); border-radius: 12px; padding: 10px 4px; font-weight: 600; font-size: 14.5px; color: var(--dim); display: grid; justify-items: center; gap: 1px; }
.seg button small { font-size: 11px; font-weight: 500; color: var(--mute); }
.seg button[aria-pressed="true"] { border-color: var(--ac); color: var(--tx); background: var(--s3); }
.who { display: inline-flex; width: 28px; height: 28px; border-radius: 50%; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #10101F; background: var(--c, var(--ac)); }
.envs { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--dim); }
.envs b { color: var(--tx); font-weight: 600; }
/* Modifier le budget */
.ed-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.ed-tabs { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }
.ed-line { display: grid; grid-template-columns: 26px 1fr auto; gap: 2px 10px; padding: 11px 14px; border-top: 1px solid var(--bd); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; align-items: center; }
.ed-line:first-child { border-top: 0; }
.ed-line .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-line .meta { grid-column: 2 / 4; font-size: 12px; color: var(--dim); }
.ed-line .amt { font-weight: 600; text-align: right; white-space: nowrap; }
.ed-line.pending .meta::after { content: ' · ⏳ pas encore envoyée'; color: var(--warn); }
.ed-add { width: 100%; background: none; border: 0; border-top: 1px solid var(--bd); color: var(--ac); padding: 13px; font-weight: 600; font-size: 14.5px; }
textarea { width: 100%; background: var(--bg); border: 1px solid var(--bd); border-radius: 12px; padding: 12px; font-size: 15px; font-family: inherit; color: inherit; min-height: 70px; resize: vertical; }
input[type=number] { width: 100%; background: var(--bg); border: 1px solid var(--bd); border-radius: 12px; padding: 12px; font-size: 16px; }
input[type=color] { width: 100%; height: 46px; background: var(--bg); border: 1px solid var(--bd); border-radius: 12px; padding: 4px; }
.three { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 10px; }
.impact { font-size: 13px; color: var(--dim); background: var(--bg); border: 1px dashed var(--bd); border-radius: 12px; padding: 9px 12px; margin: -4px 0 14px; }
.impact b { color: var(--tx); }
.rate { display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--bd); }
.rate:first-child { border-top: 0; }
.rate b { font-size: 15px; }
.btns { display: flex; gap: 10px; }
.btns .btn { flex: 1; }

/* Réglages / accueil */
.setup { background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r); padding: 18px; }
.setup h1 { font-family: var(--serif); font-size: 26px; margin: 0 0 6px; }
.setup p { color: var(--dim); font-size: 14px; margin: 0 0 16px; }
.foot { margin-top: 26px; color: var(--mute); font-size: 12px; text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); z-index: 40; background: var(--s3); border: 1px solid var(--bd); border-radius: 12px; padding: 10px 16px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4); max-width: calc(100vw - 32px); }
@media (max-width: 400px) { .stats { gap: 6px; } .stat { padding: 8px; } .stat .v { font-size: 14.5px; } }
@media (max-width: 330px) { .stats { grid-template-columns: 1fr 1fr; } .cats { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>

<header class="top">
  <div class="brand">Budget <em>Asie</em> 2027</div>
  <div class="top-actions">
    <button class="pill" id="sync" type="button" aria-live="polite"><i></i><span>…</span></button>
    <button class="icon-btn" id="open-edit" type="button" aria-label="Modifier le budget">✏️</button>
    <button class="icon-btn" id="open-settings" type="button" aria-label="Réglages">⚙︎</button>
  </div>
</header>

<main id="app"></main>

<button class="fab" id="fab" type="button" hidden><span>+</span> Dépense</button>

<div class="sheet-bg" id="sheet-bg" hidden></div>
<form class="sheet" id="sheet" hidden autocomplete="off" novalidate>
  <div class="grab"></div>
  <h3>Nouvelle dépense <button type="button" class="icon-btn" id="close-sheet" aria-label="Fermer">✕</button></h3>
  <div class="amount">
    <input id="f-montant" inputmode="decimal" placeholder="0" aria-label="Montant" enterkeyhint="done">
    <select id="f-devise" aria-label="Devise"></select>
  </div>
  <div class="conv num" id="f-conv"></div>
  <div class="field"><span>Catégorie</span><div class="cats" id="f-cats"></div></div>
  <div class="two">
    <label class="field"><span id="f-pays-lbl">Pays</span><select id="f-pays"></select></label>
    <label class="field"><span>Date</span><input type="date" id="f-date"></label>
  </div>
  <div class="hint" id="f-imprevu" hidden></div>
  <label class="field" id="f-etape-wrap"><span>Hôtel · étape</span><select id="f-etape"></select></label>
  <label class="check" id="f-resv-wrap"><input type="checkbox" id="f-resv"><span>Réservé, à payer sur place<small>Compté dans le budget dès maintenant ; à marquer « payé » une fois réglé.</small></span></label>
  <label class="field"><span>Libellé (facultatif)</span><input type="text" id="f-libelle" maxlength="120" placeholder="ex. ramen à Shinjuku"></label>
  <div class="field"><span>Pour qui ?</span><div class="seg" id="f-pour"></div></div>
  <div class="err-msg" id="f-err" role="alert"></div>
  <button class="btn primary wide" type="submit">Enregistrer</button>
</form>

<form class="sheet" id="ed-sheet" hidden autocomplete="off" novalidate></form>

<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
  'use strict';
  // ── Référentiel du voyage ──
  const PAYS_DEFAUT = [ // remplacé par l'onglet « Pays » du Sheet dès la première synchro
    { nom: 'Thaïlande', c: 'var(--th)', dev: 'THB', debut: '2027-02-17', fin: '2027-03-10' },
    { nom: 'Vietnam', c: 'var(--vn)', dev: 'VND', debut: '2027-03-11', fin: '2027-03-31' },
    { nom: 'Japon', c: 'var(--jp)', dev: 'JPY', debut: '2027-04-01', fin: '2027-04-29' },
    { nom: 'Corée', c: 'var(--kr)', dev: 'KRW', debut: '2027-04-30', fin: '2027-05-08' },
    { nom: 'Chine + HK', c: 'var(--cn)', dev: 'CNY', debut: '2027-05-09', fin: '2027-05-31' },
    { nom: 'Général', c: 'var(--gen)', dev: 'CHF', debut: null, fin: null },
  ];
  const CATS = [
    { k: '🏨 Hôtels', ico: '🏨', court: 'Hôtel', ex: 'ex. 4 nuits réservées sur Booking' },
    { k: '🚆 Transports', ico: '🚆', court: 'Transport', ex: 'ex. Shinkansen Kyoto → Himeji' },
    { k: '🍜 Repas & sorties', ico: '🍜', court: 'Repas', ex: 'ex. ramen à Shinjuku' },
    { k: '🎟️ Activités', ico: '🎟️', court: 'Activité', ex: 'ex. entrée Fushimi Inari' },
    { k: '🛍️ Shopping', ico: '🛍️', court: 'Shopping', ex: 'ex. souvenirs, vêtements' },
    { k: '📦 Divers', ico: '📦', court: 'Divers', ex: 'ex. SIM, lessive, taxe, visa' },
    { k: '🛟 Réserve imprévus', ico: '🛟', court: 'Imprévu', ex: 'ex. médecin, vol raté' },
  ];
  const HOTEL = CATS[0].k;
  const IMPREVU = CATS[6].k; // toujours saisi sur « Général » : c'est là qu'est la réserve
  const RESV = 'réservé';    // hôtel réservé, à payer sur place
  // Qui paie quoi : chaque dépense est pour Michael, pour Océ ou pour « Nous 2 » (moitié chacun).
  // Shopping et divers : une enveloppe par personne. Le reste (hôtels, vols, repas, activités…) est commun.
  const PERSONNES = [{ nom: 'Michael', c: '#5DADE2' }, { nom: 'Océ', c: '#FF8FB8' }];
  const NOUS = 'Nous 2';
  const CATS_PERSO = ['🛍️ Shopping', '📦 Divers'];
  const GENERAL = 'Général';
  const DEVISES = ['CHF', 'THB', 'VND', 'JPY', 'KRW', 'CNY', 'HKD', 'USD', 'EUR'];
  const K = { cfg: 'ba27-config', snap: 'ba27-snapshot', queue: 'ba27-queue', ui: 'ba27-ui' };

  // ── Outils ──
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nf0 = new Intl.NumberFormat('fr-CH', { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat('fr-CH', { maximumFractionDigits: 2 });
  const chf = (n) => nf0.format(Math.round(n || 0)) + ' CHF';
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  const pad = (n) => String(n).padStart(2, '0');
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); const t = new Date(y, m - 1, d + n); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; };
  const dayDiff = (a, b) => { const p = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 864e5); };
  const dateTxt = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('fr-CH', { day: 'numeric', month: 'short' }); };
  const parseNum = (v) => { const s = String(v || '').replace(/[\s']/g, '').replace(',', '.'); if (!s) return NaN; return Number(s); };
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12));
  const paysL = () => etat().pays;
  const paysMeta = (nom) => paysL().find((p) => p.nom === nom) || paysL().find((p) => p.nom === GENERAL) || { nom, c: 'var(--gen)', dev: 'CHF' };
  const catMeta = (k) => CATS.find((c) => c.k === k) || { k, ico: '•', court: k };
  const sansAccent = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();
  /** Michael, Océ ou Nous 2 (tout le reste, dont l'ancien « Commun », compte pour les deux). */
  const pourDe = (v) => (PERSONNES.find((p) => sansAccent(p.nom) === sansAccent(v)) || { nom: NOUS }).nom;
  /** Part de la personne p dans une dépense ou une ligne de budget « pour » quelqu'un. */
  const part = (pour, p) => (pour === p ? 1 : pour === NOUS ? 0.5 : 0);
  const moi = () => (cfg ? PERSONNES.find((p) => sansAccent(p.nom) === sansAccent(cfg.qui)) : null);
  const persMeta = (nom) => PERSONNES.find((p) => p.nom === nom) || { nom, c: 'var(--ac)' };

  // ── État ──
  let cfg = load(K.cfg, null);            // { api, qui }
  let snap = load(K.snap, null);          // { lignes, taux, journal, maj }
  let queue = load(K.queue, []);          // [{ type:'add', entry } | { type:'cancel', id } | { type:'pay', id }]
  const ui = Object.assign({ pays: null, showAll: false }, load(K.ui, {}));
  let syncing = false, lastError = '', openEntry = null, confirmId = null;

  // Lien d'installation partagé : #api=…
  function readHash() {
    const h = location.hash.slice(1);
    if (!h.startsWith('api=')) return false;
    const api = decodeURIComponent(h.slice(4));
    history.replaceState(null, '', location.pathname + location.search);
    if (/^https:\/\/script\.google(usercontent)?\.com\//.test(api)) cfg = Object.assign({}, cfg || {}, { api });
    if (cfg) save(K.cfg, cfg);
    return true;
  }
  readHash();
  window.addEventListener('hashchange', () => { if (readHash()) { render(); sync(); } });

  // ── Calculs ──
  function taux() { return etat().taux; }
  function toChf(montant, dev) { const t = taux()[dev]; return t > 0 ? montant / t : 0; }

  // ── Budget modifiable (lignes, pays, taux, plafond) ──
  // Les modifications partent dans la même file d'attente que les dépenses (elles marchent donc hors ligne) et sont
  // appliquées tout de suite à l'écran. La réserve imprévus = plafond − toutes les autres lignes (0 au minimum).
  const EDITS = ['ligne', 'ligneAjout', 'ligneSuppr', 'pays', 'paysAjout', 'paysSuppr', 'taux', 'reglages'];
  const OPTION = 'Option (non comptée)';
  const STATUTS_DEFAUT = ['Estimé', 'Prix vérifié', 'Réservé', 'Payé', OPTION];
  const estReserve = (l) => l.cat === IMPREVU && l.pays === GENERAL;
  let etatCle = '', etatVal = null;
  function etat() {
    const cle = (snap ? snap.maj : '') + '|' + JSON.stringify(queue.filter((o) => EDITS.includes(o.type)));
    if (cle === etatCle && etatVal) return etatVal;
    const e = {
      lignes: (snap ? snap.lignes : []).map((l) => Object.assign({}, l)),
      pays: ((snap && snap.pays) || PAYS_DEFAUT).map((p) => Object.assign({}, p)),
      taux: Object.assign({ CHF: 1 }, snap && snap.taux),
      plafond: snap && snap.reglages ? snap.reglages.plafond : null,
      statuts: (snap && snap.statuts && snap.statuts.length) ? snap.statuts : STATUTS_DEFAUT,
    };
    let modifie = false;
    for (const o of queue) {
      if (!EDITS.includes(o.type)) continue;
      modifie = true;
      if (o.type === 'ligne') { const l = e.lignes.find((x) => x.id === o.id); if (l) Object.assign(l, o.champs, { pending: true }); }
      else if (o.type === 'ligneAjout') e.lignes.push(Object.assign({ etape: '', qte: 1, prix: 0, devise: 'CHF', statut: 'Estimé', pour: NOUS, date: null, note: '' }, o.ligne, { pending: true }));
      else if (o.type === 'ligneSuppr') e.lignes = e.lignes.filter((x) => x.id !== o.id);
      else if (o.type === 'pays') {
        const p = e.pays.find((x) => x.nom === o.nom);
        if (!p) continue;
        const c = o.champs || {};
        if ('debut' in c) p.debut = c.debut;
        if ('fin' in c) p.fin = c.fin;
        if ('devise' in c) p.dev = c.devise;
        if ('couleur' in c) p.c = c.couleur;
        if (c.nom && c.nom !== o.nom) { e.lignes.forEach((l) => { if (l.pays === o.nom) l.pays = c.nom; }); p.nom = c.nom; }
      }
      else if (o.type === 'paysAjout') { const g = e.pays.findIndex((x) => x.nom === GENERAL); e.pays.splice(g >= 0 ? g : e.pays.length, 0, { nom: o.pays.nom, debut: o.pays.debut, fin: o.pays.fin, dev: o.pays.devise, c: o.pays.couleur }); }
      else if (o.type === 'paysSuppr') e.pays = e.pays.filter((x) => x.nom !== o.nom);
      else if (o.type === 'taux') Object.assign(e.taux, o.valeurs);
      else if (o.type === 'reglages') e.plafond = o.plafond;
    }
    if (modifie) {
      // Même calcul que le Sheet : prévu = qté × prix ÷ taux (0 pour une option), puis la réserve
      for (const l of e.lignes) if (!estReserve(l)) l.prevu = l.statut === OPTION ? 0 : Math.round((l.qte || 0) * (l.prix || 0) / (e.taux[l.devise] || 1) * 100) / 100;
      const r = e.lignes.find(estReserve);
      if (r && e.plafond) { r.prevu = r.prix = Math.max(0, Math.round((e.plafond - e.lignes.reduce((s, l) => s + (l === r ? 0 : l.prevu || 0), 0)) * 100) / 100); r.qte = 1; }
    }
    etatCle = cle; etatVal = e;
    return e;
  }

  /** Journal visible = serveur + saisies en attente, moins les annulations. */
  function journal() {
    const cancelled = new Set(queue.filter((o) => o.type === 'cancel').map((o) => o.id));
    const paid = new Set(queue.filter((o) => o.type === 'pay').map((o) => o.id));
    const server = (snap ? snap.journal : []).filter((e) => e.statut !== 'annulé' && !cancelled.has(e.id))
      .map((e) => Object.assign({}, e, { qui: pourDe(e.qui), chf: e.chf != null ? e.chf : toChf(e.montant, e.devise) }, paid.has(e.id) ? { statut: 'ok', pendingPay: true } : null));
    const known = new Set(server.map((e) => e.id));
    const pending = queue.filter((o) => o.type === 'add' && !known.has(o.entry.id) && !cancelled.has(o.entry.id))
      .map((o) => Object.assign({}, o.entry, { qui: pourDe(o.entry.qui), chf: toChf(o.entry.montant, o.entry.devise), pending: true }));
    return server.concat(pending).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.saisi || '').localeCompare(a.saisi || ''));
  }

  /**
   * Chaque paiement est rattaché à sa ligne de budget (pays + catégorie, + étape pour un hôtel ; sinon la ligne « Général »
   * de la catégorie, ex. le shopping). Ligne commune : tout le paiement. Enveloppes perso : la dépense de la personne,
   * plus la moitié d'une dépense « Nous 2 ». parts = ce que chaque personne a dépensé sur la ligne.
   */
  function model() {
    const zero = () => Object.fromEntries(PERSONNES.map((p) => [p.nom, 0]));
    const rows = etat().lignes.map((l) => Object.assign({}, l, {
      pour: pourDe(l.pour), prevu: l.statut === 'Option (non comptée)' ? 0 : (l.prevu || 0), paye: 0, aPayer: 0, parts: zero(),
    }));
    const jr = journal();
    const ajoute = (r, e, montant, parts) => {
      r.paye += montant;
      if (e.statut === RESV) r.aPayer += montant;
      for (const p in parts) r.parts[p] += parts[p];
    };
    const horsBudget = new Map(); // paiements sans ligne de budget (ex. une activité sur « Général ») : comptés quand même
    for (const e of jr) {
      const vise = (pays) => rows.filter((r) => r.pays === pays && r.cat === e.cat && (e.cat !== HOTEL || r.etape === e.etape));
      let ls = vise(e.pays);
      if (!ls.length && e.cat !== HOTEL) ls = vise(GENERAL);
      const partsDe = (s) => Object.fromEntries(PERSONNES.map((p) => [p.nom, e.chf * s(p.nom)]));
      const commune = ls.find((r) => r.pour === NOUS);
      if (commune) { ajoute(commune, e, e.chf, partsDe((p) => part(e.qui, p))); continue; }
      for (const p of PERSONNES) {
        const s = part(e.qui, p.nom);
        if (!s) continue;
        let r = ls.find((x) => x.pour === p.nom);
        if (!r) {
          const k = `${e.pays}|${e.cat}|${e.cat === HOTEL ? e.etape : ''}`;
          if (!horsBudget.has(k)) horsBudget.set(k, { pays: e.pays, cat: e.cat, etape: e.cat === HOTEL ? e.etape : '', poste: catMeta(e.cat).court + ' (hors budget)', pour: NOUS, prevu: 0, paye: 0, aPayer: 0, parts: zero(), qte: 0, horsBudget: true });
          r = horsBudget.get(k);
        }
        ajoute(r, e, e.chf * s, { [p.nom]: e.chf * s });
      }
    }
    rows.push(...horsBudget.values());
    for (const r of rows) {
      r.estim = !r.paye ? r.prevu : r.cat === HOTEL ? r.paye : Math.max(r.prevu, r.paye);
      r.reste = r.estim - r.paye; // ce qui reste à dépenser sur la ligne
    }
    return { rows, jr };
  }

  /** Où en est chacun : budget (moitié du commun + ses enveloppes), dépensé, estimation finale, enveloppes perso. */
  function parPersonne(rows) {
    return PERSONNES.map((p) => {
      const budget = rows.reduce((s, r) => s + r.prevu * part(r.pour, p.nom), 0);
      const depense = rows.reduce((s, r) => s + r.parts[p.nom], 0);
      const estim = rows.reduce((s, r) => s + r.parts[p.nom] + r.reste * part(r.pour, p.nom), 0);
      const envs = CATS_PERSO.map((c) => {
        const rs = rows.filter((r) => r.cat === c && r.pour === p.nom);
        return { c, n: rs.length, prevu: rs.reduce((s, r) => s + r.prevu, 0), paye: rs.reduce((s, r) => s + r.parts[p.nom], 0) };
      }).filter((x) => x.n);
      return Object.assign({ budget, depense, estim, envs }, p);
    });
  }

  function currentPays() {
    const t = today();
    const P = paysL().filter((x) => x.debut);
    const p = P.find((x) => t >= x.debut && t <= x.fin);
    if (p) return p.nom;
    return P.length && t < P[0].debut ? 'Général' : 'Tout';
  }

  /** Hôtel de ce soir : si deux séjours se chevauchent (Krabi en 2 fois, Hanoï), le plus récent l'emporte. */
  function hotelDuSoir(hotels) {
    const t = today();
    return hotels.filter((l) => l.date && t >= l.date && t < addDays(l.date, l.qte || 1))
      .sort((a, b) => b.date.localeCompare(a.date))[0] || null;
  }
  function currentHotelEtape(pays) {
    const h = hotelDuSoir(etat().lignes.filter((l) => l.pays === pays && l.cat === HOTEL));
    return h ? h.etape : '';
  }

  // ── Rendu ──
  function render() {
    renderSync();
    const app = $('#app');
    if (!cfg || !cfg.api || !moi()) { $('#fab').hidden = true; app.innerHTML = setupHtml(); bindSetup(); return; }
    $('#fab').hidden = !snap;
    if (!snap) {
      app.innerHTML = `<div class="setup"><h1>Première synchro…</h1><p>Il faut du réseau une première fois pour charger le budget depuis le Google Sheet. Ensuite, l’appli marche aussi sans connexion.</p>${lastError ? `<p class="bad">${esc(lastError)}</p><button class="btn" type="button" data-act="sync">Réessayer</button>` : ''}</div>`;
      return;
    }
    if (ui.edit) { $('#fab').hidden = true; app.innerHTML = editHtml(); return; }
    const m = model();
    const sel = ui.pays || currentPays();
    const scope = sel === 'Tout' ? m.rows : m.rows.filter((r) => r.pays === sel);
    const meta = sel === 'Tout' ? { c: 'var(--ac)' } : paysMeta(sel);
    const prevu = scope.reduce((s, r) => s + r.prevu, 0);
    const paye = scope.reduce((s, r) => s + r.paye, 0);
    const estim = scope.reduce((s, r) => s + r.estim, 0);
    const pct = prevu ? Math.min(100, paye / prevu * 100) : 0;

    let h = '';
    if (isIos() && !isStandalone()) h += `<div class="banner warn">📲 <b>Installe l’appli</b> : bouton Partager de Safari → « Sur l’écran d’accueil ». Ouvre-la ensuite toujours depuis l’icône.</div>`;

    { const e = etat(), b = resumeBudget(e); if (e.plafond && b.depasse > 0.5) h += `<div class="banner warn">⚠️ La réserve est à 0 : le budget dépasse le plafond de <b>${chf(b.depasse)}</b>. Ajuste dans ✏️.</div>`; }
    h += `<nav class="chips" aria-label="Pays">${['Tout', ...paysL().map((p) => p.nom)].map((n) => {
      const c = n === 'Tout' ? 'var(--ac)' : paysMeta(n).c;
      return `<button class="chip" type="button" data-pays="${esc(n)}" aria-pressed="${n === sel}" style="--c:${c}"><span class="dot"></span>${esc(n === 'Tout' ? 'Tout le voyage' : n)}</button>`;
    }).join('')}</nav>`;

    // Carte principale
    let kicker = sel === 'Tout' ? '2 personnes · 103 nuits' : sel === 'Général' ? 'Vols · avant départ · réserve' : `${dateTxt(meta.debut)} → ${dateTxt(meta.fin)}`;
    let resteJour = '';
    const t = today();
    if (meta.debut && t >= meta.debut && t <= meta.fin) {
      const jours = dayDiff(t, meta.fin) + 1;
      const done = dayDiff(meta.debut, t) + 1;
      kicker = `Jour ${done} sur ${dayDiff(meta.debut, meta.fin) + 1} · ${sel}`;
      const resteHorsHotel = scope.filter((r) => r.cat !== HOTEL).reduce((s, r) => s + Math.max(0, r.prevu - r.paye), 0);
      resteJour = `<div class="stat"><div class="l">Reste / jour</div><div class="v num">${chf(resteHorsHotel / jours)}</div></div>`;
    }
    const ecart = estim - prevu;
    h += `<section class="hero" style="--c:${meta.c}">
      <div class="kicker">${esc(kicker)}</div>
      <h1>${esc(sel === 'Tout' ? 'Tout le voyage' : sel)}</h1>
      <div class="big"><span class="v num">${chf(paye)}</span><span class="of num">payés sur ${chf(prevu)}</span></div>
      <div class="bar ${paye > prevu ? 'over' : ''}"><span style="width:${pct.toFixed(1)}%"></span></div>
      <div class="stats">
        <div class="stat"><div class="l">Reste</div><div class="v num ${prevu - paye < 0 ? 'bad' : ''}">${chf(prevu - paye)}</div></div>
        <div class="stat"><div class="l">Estimation</div><div class="v num ${ecart > 1 ? 'bad' : ecart < -1 ? 'good' : ''}">${chf(estim)}</div></div>
        ${resteJour || `<div class="stat"><div class="l">Écart</div><div class="v num ${ecart > 1 ? 'bad' : ecart < -1 ? 'good' : ''}">${ecart > 0 ? '+' : ''}${nf0.format(Math.round(ecart))}</div></div>`}
      </div>
    </section>`;

    // Par personne
    h += `<h2>Par personne <small>dépensé / budget</small></h2><div class="card">`;
    h += parPersonne(scope).map((p) => {
      const over = p.depense > p.budget + 0.5;
      const envs = p.envs.map((e) => `<span>${catMeta(e.c).ico} <b class="${e.paye > e.prevu + 0.5 ? 'bad' : ''}">${nf0.format(Math.round(e.paye))}</b> / ${nf0.format(Math.round(e.prevu))}</span>`).join('');
      return `<div class="row" style="--c:${p.c}"><span class="who">${esc(p.nom[0])}</span><span class="name">${esc(p.nom)}${moi() && moi().nom === p.nom ? ' <small class="meta" style="color:var(--dim);font-weight:500">· toi</small>' : ''}</span>
        <span class="amt num">${chf(p.depense)} <small>/ ${nf0.format(Math.round(p.budget))}</small></span>
        <div class="bar ${over ? 'over' : ''}"><span style="width:${p.budget ? Math.min(100, p.depense / p.budget * 100).toFixed(1) : 0}%"></span></div>
        <div class="sub"><span>${over ? `<span class="bad">Dépassé de ${chf(p.depense - p.budget)}</span>` : `Reste ${chf(p.budget - p.depense)}`}</span><span class="num ${p.estim > p.budget + 1 ? 'bad' : ''}">Estimation ${chf(p.estim)}</span></div>
        ${envs ? `<div class="envs">${envs}</div>` : ''}</div>`;
    }).join('');
    h += `</div>`;

    // Par catégorie
    h += `<h2>Par catégorie <small>payé / prévu</small></h2><div class="card">`;
    const cats = CATS.map((c) => {
      const rs = scope.filter((r) => r.cat === c.k);
      return { c, prevu: rs.reduce((s, r) => s + r.prevu, 0), paye: rs.reduce((s, r) => s + r.paye, 0), n: rs.length };
    }).filter((x) => x.n);
    h += cats.map(({ c, prevu: pv, paye: pp }) => {
      const over = pp > pv + 0.5;
      return `<div class="row"><span class="ico">${c.ico}</span><span class="name">${esc(c.k.replace(/^\S+\s/, ''))}</span>
        <span class="amt num">${chf(pp)} <small>/ ${nf0.format(Math.round(pv))}</small></span>
        <div class="bar ${over ? 'over' : ''}" style="--c:${meta.c}"><span style="width:${pv ? Math.min(100, pp / pv * 100).toFixed(1) : (pp ? 100 : 0)}%"></span></div>
        <div class="sub"><span>${over ? `<span class="bad">Dépassé de ${chf(pp - pv)}</span>` : `Reste ${chf(pv - pp)}`}</span></div></div>`;
    }).join('') || `<div class="empty">Rien de prévu ici.</div>`;
    h += `</div>`;

    // Hôtels par étape
    const hotels = scope.filter((r) => r.cat === HOTEL && !r.horsBudget).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    if (hotels.length) {
      const hp = hotels.reduce((s, r) => s + r.prevu, 0), hr = hotels.reduce((s, r) => s + r.paye, 0);
      const aRes = hotels.filter((r) => !r.paye).length;
      const nSurPlace = hotels.filter((r) => r.aPayer > 0).length;
      const surPlace = hotels.reduce((s, r) => s + r.aPayer, 0);
      const resume = [aRes ? `${aRes} à réserver` : 'tout est réservé', nSurPlace ? `${nSurPlace} à payer sur place` : ''].filter(Boolean).join(' · ');
      h += `<h2>Hôtels par étape <small>${resume}</small></h2><div class="card">`;
      const cur = currentPays() === sel || sel === 'Tout' ? hotelDuSoir(hotels) : null;
      h += hotels.map((r) => {
        const d = r.paye - r.prevu;
        const ecartTag = `<span class="tag ${d > 0.5 ? 'over' : 'under'}">${d > 0.5 ? '+' : d < -0.5 ? '−' : ''}${nf0.format(Math.abs(Math.round(d)))}</span>`;
        const statut = r.aPayer > 0 ? `<span class="tag resv">Réservé</span>` : `<span class="tag under">Payé</span>`;
        const tags = r.paye ? statut + ecartTag : `<span class="tag">À réserver</span>`;
        return `<div class="hotel"><div><div class="name">${esc(r.etape)} ${r === cur ? '<span class="tag now">ce soir</span>' : ''}</div>
          <div class="meta">${dateTxt(r.date)} · ${r.qte} nuit${r.qte > 1 ? 's' : ''} · budget ${nf0.format(Math.round(r.prevu / (r.qte || 1)))}/nuit${sel === 'Tout' ? ' · ' + esc(r.pays) : ''}${r.aPayer > 0 ? ` · <span class="resv-txt">${chf(r.aPayer)} à payer sur place</span>` : ''}</div></div>
          <div class="right num"><div>${r.paye ? chf(r.paye) : chf(r.prevu)}</div><div class="tags">${tags}</div></div></div>`;
      }).join('');
      h += `<div class="hotel"><div><div class="name">Total hôtels</div>${surPlace ? `<div class="meta">dont <span class="resv-txt">${chf(surPlace)} à payer sur place</span></div>` : ''}</div><div class="right num"><b>${chf(hr)}</b> <span class="meta">/ ${chf(hp)}</span></div></div></div>`;
    }

    // Dernières dépenses
    // Un imprévu compte sur « Général », mais reste listé dans le pays où il a eu lieu
    const jr = (sel === 'Tout' ? m.jr : m.jr.filter((e) => e.pays === sel || (e.cat === IMPREVU && (e.libelle || '').endsWith(' · ' + sel))));
    const shown = ui.showAll ? jr : jr.slice(0, 12);
    h += `<h2>Dépenses <small>${jr.length} saisie${jr.length > 1 ? 's' : ''}</small></h2><div class="card">`;
    h += shown.map((e) => {
      const c = catMeta(e.cat);
      const open = openEntry === e.id;
      return `<button class="entry ${e.pending ? 'pending' : ''}" type="button" data-entry="${esc(e.id)}" aria-expanded="${open}">
          <span class="ico">${c.ico}</span><span class="name">${esc(e.libelle || c.court + (e.etape ? ' · ' + e.etape : ''))}</span><span class="amt num">${chf(e.chf)}</span>
          <span class="meta">${dateTxt(e.date)} · ${e.qui === NOUS ? '👥 Nous 2' : '👤 ' + esc(e.qui)}${sel === 'Tout' ? ' · ' + esc(e.pays) : ''}${e.statut === RESV ? ' · <span class="resv-txt">à payer sur place</span>' : ''}${e.pays !== sel && sel !== 'Tout' ? ' · sur la réserve' : ''}</span><span class="loc num">${e.devise === 'CHF' ? '' : nf2.format(e.montant) + ' ' + esc(e.devise)}</span>
        </button>${open ? `<div class="entry-actions">${e.statut === RESV ? `<button class="btn" type="button" data-pay="${esc(e.id)}">✓ Marquer comme payé</button>` : ''}<button class="btn danger" type="button" data-cancel="${esc(e.id)}">${confirmId === e.id ? 'Confirmer l’annulation' : e.statut === RESV ? 'Annuler' : 'Annuler cette dépense'}</button></div>` : ''}`;
    }).join('') || `<div class="empty">Aucune dépense saisie pour l’instant. Appuie sur « + Dépense ».</div>`;
    if (jr.length > shown.length) h += `<button class="more" type="button" data-act="all">Voir les ${jr.length} dépenses</button>`;
    h += `</div>`;

    h += `<p class="foot">Données du ${snap.maj ? new Date(snap.maj).toLocaleString('fr-CH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—'} · tout est enregistré dans le Google Sheet « Budget Asie 2027 »</p>`;
    app.innerHTML = h;
  }

  function renderSync() {
    const el = $('#sync');
    const n = queue.length;
    let cls = '', txt = '';
    if (!cfg || !cfg.api) { txt = 'Non configurée'; }
    else if (syncing) { cls = 'busy'; txt = 'Synchro…'; }
    else if (n) { cls = lastError && navigator.onLine ? 'err' : 'wait'; txt = `${n} en attente${!navigator.onLine ? ' · hors ligne' : lastError ? ' · réessayer' : ''}`; }
    else if (lastError) { cls = 'err'; txt = 'Échec · réessayer'; }
    else if (!navigator.onLine) { txt = 'Hors ligne'; }
    else if (snap && snap.maj) { cls = 'ok'; txt = 'À jour · ' + new Date(snap.maj).toLocaleTimeString('fr-CH', { hour: '2-digit', minute: '2-digit' }); }
    el.className = 'pill ' + cls;
    el.innerHTML = `<i></i><span>${esc(txt)}</span>`;
  }

  // ── Modifier le budget ──
  function pousser(op) {
    op.oid = uid();
    op.qui = moi() ? moi().nom : '';
    queue.push(op);
    if (!save(K.queue, queue)) toast('Attention : stockage du téléphone indisponible, synchronise vite.');
    render();
    sync();
  }
  const ordreCat = (c) => { const i = CATS.findIndex((x) => x.k === c); return i < 0 ? 99 : i; };
  function resumeBudget(e) {
    const total = e.lignes.reduce((s, l) => s + (l.prevu || 0), 0);
    const r = e.lignes.find(estReserve);
    return { total, reserve: r ? r.prevu || 0 : 0, depasse: e.plafond ? total - e.plafond : 0 };
  }

  function editHtml() {
    const e = etat();
    const { total, reserve, depasse } = resumeBudget(e);
    const tab = ui.edTab || 'lignes';
    let h = `<h2 style="margin-top:4px">✏️ Modifier le budget <button class="icon-btn" type="button" data-act="edit-close" aria-label="Fermer">✕</button></h2>
      <div class="ed-sum">
        <div class="stat"><div class="l">Plafond</div><div class="v num">${e.plafond ? chf(e.plafond) : '—'}</div></div>
        <div class="stat"><div class="l">Total prévu</div><div class="v num ${depasse > 0.5 ? 'bad' : ''}">${chf(total)}</div></div>
        <div class="stat"><div class="l">${depasse > 0.5 ? 'Dépasse de' : 'Réserve'}</div><div class="v num ${depasse > 0.5 || reserve < 1 ? 'bad' : 'good'}">${chf(depasse > 0.5 ? depasse : reserve)}</div></div>
      </div>
      <nav class="ed-tabs">${[['lignes', 'Lignes'], ['pays', 'Pays & dates'], ['taux', 'Taux'], ['plafond', 'Plafond']].map(([k, n]) => `<button class="chip" type="button" data-edtab="${k}" aria-pressed="${k === tab}">${n}</button>`).join('')}</nav>`;

    if (tab === 'lignes') {
      const noms = e.pays.map((p) => p.nom);
      const sel = noms.includes(ui.edPays) ? ui.edPays : noms[0];
      h += `<nav class="chips" aria-label="Pays">${noms.map((n) => `<button class="chip" type="button" data-edpays="${esc(n)}" aria-pressed="${n === sel}" style="--c:${paysMeta(n).c}"><span class="dot"></span>${esc(n)}</button>`).join('')}</nav>`;
      const ls = e.lignes.filter((l) => l.pays === sel)
        .sort((a, b) => ordreCat(a.cat) - ordreCat(b.cat) || (a.date || '').localeCompare(b.date || ''));
      const sousTotal = ls.reduce((s, l) => s + (l.prevu || 0), 0);
      h += `<div class="card">${ls.map((l) => {
        const c = catMeta(l.cat);
        const meta = [l.cat === HOTEL ? esc(l.etape) + (l.date ? ' · ' + dateTxt(l.date) : '') : '', `${nf2.format(l.qte || 0)} × ${nf2.format(l.prix || 0)} ${esc(l.devise)}`,
          l.pour === NOUS ? '👥 Nous 2' : '👤 ' + esc(l.pour), l.statut && l.statut !== 'Estimé' ? esc(l.statut) : ''].filter(Boolean).join(' · ');
        return `<button class="ed-line ${l.pending ? 'pending' : ''}" type="button" data-edl="${esc(l.id)}"><span class="ico">${c.ico}</span><span class="name">${esc(l.poste)}</span><span class="amt num">${chf(l.prevu)}</span><span class="meta">${estReserve(l) ? 'calculée toute seule : plafond − le reste' : meta}</span></button>`;
      }).join('') || `<div class="empty">Aucune ligne pour ce pays.</div>`}
        <button class="ed-add" type="button" data-act="ed-add">+ Ajouter une ligne · ${esc(sel)}</button></div>
        <p class="foot">Total ${esc(sel)} : ${chf(sousTotal)} · touche une ligne pour la modifier</p>`;
    } else if (tab === 'pays') {
      h += `<div class="card">${e.pays.map((p) => {
        const n = p.debut && p.fin ? dayDiff(p.debut, p.fin) + 1 : 0;
        return `<button class="ed-line" type="button" data-edp="${esc(p.nom)}"><span class="ico"><span class="who" style="--c:${esc(p.c)};width:14px;height:14px"></span></span><span class="name">${esc(p.nom)}</span><span class="amt">${esc(p.dev)}</span><span class="meta">${p.debut ? `${dateTxt(p.debut)} → ${dateTxt(p.fin)} · ${n} nuit${n > 1 ? 's' : ''}` : 'vols · avant départ · réserve'}</span></button>`;
      }).join('')}<button class="ed-add" type="button" data-act="pays-add">+ Ajouter un pays</button></div>
      <p class="foot">Dates = de la première à la dernière nuit dans le pays.</p>`;
    } else if (tab === 'taux') {
      h += `<div class="card">${Object.keys(e.taux).filter((d) => d !== 'CHF').map((d) => `<label class="rate"><b>${esc(d)}</b><input type="number" step="any" min="0" inputmode="decimal" data-taux="${esc(d)}" value="${e.taux[d]}"></label>`).join('')}</div>
        <p class="foot">1 CHF = … dans chaque devise.</p>
        <div class="btns"><button class="btn" type="button" data-act="taux-jour">🔄 Taux du jour</button><button class="btn primary" type="button" data-act="taux-save">Enregistrer</button></div>`;
    } else {
      h += `<div class="card" style="padding:16px"><label class="field"><span>Plafond du budget (CHF à deux)</span><input type="number" id="pl-val" min="0" step="100" inputmode="numeric" value="${e.plafond || ''}"></label>
        <div class="hint">La <b>réserve imprévus</b> = plafond − toutes les autres lignes. Si une ligne augmente, la réserve baisse d'abord ; une fois à zéro, c'est le total qui dépasse le plafond.</div>
        <button class="btn primary wide" type="button" data-act="pl-save">Enregistrer</button></div>`;

    return h;
  }

  let edLigne = null, edPays = null, edConfirm = false;
  function ouvrirEdSheet(html) {
    $('#ed-sheet').innerHTML = `<div class="grab"></div>${html}`;
    $('#ed-sheet').hidden = false; $('#sheet-bg').hidden = false;
    edConfirm = false;
  }
  function fermerEdSheet() { $('#ed-sheet').hidden = true; $('#sheet-bg').hidden = true; edLigne = null; edPays = null; }

  function ouvrirLigne(id) {
    const e = etat();
    const pays = ui.edPays && e.pays.some((p) => p.nom === ui.edPays) ? ui.edPays : e.pays[0].nom;
    const l = id ? e.lignes.find((x) => x.id === id) : { id: null, pays, cat: HOTEL, etape: '', poste: '', qte: 1, prix: 0, devise: paysMeta(pays).dev || 'CHF', date: '', pour: NOUS, statut: 'Estimé', note: '', prevu: 0 };
    if (!l) return;
    edLigne = l;
    const res = estReserve(l);
    const opt = (list, v) => list.map((x) => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
    ouvrirEdSheet(`<h3>${id ? 'Modifier la ligne' : 'Nouvelle ligne'} <button type="button" class="icon-btn" data-act="ed-close" aria-label="Fermer">✕</button></h3>
      ${res ? `<div class="hint">🛟 La réserve se calcule toute seule : <b>plafond − toutes les autres lignes</b>. Change le plafond pour la modifier.</div>` : ''}
      <div class="two">
        <label class="field"><span>Pays</span><select id="e-pays" ${res ? 'disabled' : ''}>${opt(e.pays.map((p) => p.nom), l.pays)}</select></label>
        <label class="field"><span>Catégorie</span><select id="e-cat" ${res ? 'disabled' : ''}>${CATS.filter((c) => res || c.k !== IMPREVU).map((c) => `<option value="${esc(c.k)}" ${c.k === l.cat ? 'selected' : ''}>${esc(c.k)}</option>`).join('')}</select></label>
      </div>
      <label class="field"><span>Poste</span><input type="text" id="e-poste" maxlength="200" value="${esc(l.poste)}" placeholder="ex. Hôtel Kyoto · 6 nuits"></label>
      <label class="field" id="e-etape-wrap"><span>Étape (nom de la ville de l'hôtel)</span><input type="text" id="e-etape" maxlength="60" value="${esc(l.etape)}" placeholder="ex. Kyoto"></label>
      <div class="three">
        <label class="field"><span id="e-qte-lbl">Qté</span><input type="number" id="e-qte" min="0" step="any" inputmode="decimal" value="${l.qte ?? 1}" ${res ? 'disabled' : ''}></label>
        <label class="field"><span>Prix unitaire</span><input type="number" id="e-prix" min="0" step="any" inputmode="decimal" value="${l.prix ?? 0}" ${res ? 'disabled' : ''}></label>
        <label class="field"><span>Devise</span><select id="e-devise" ${res ? 'disabled' : ''}>${opt(Object.keys(e.taux), l.devise)}</select></label>
      </div>
      <div class="impact num" id="e-impact"></div>
      <div class="two">
        <label class="field"><span>Date (1re nuit)</span><input type="date" id="e-date" value="${esc(l.date || '')}"></label>
        <label class="field"><span>Statut</span><select id="e-statut">${opt(e.statuts, l.statut || 'Estimé')}</select></label>
      </div>
      <div class="field"><span>Pour qui ?</span><div class="seg" id="e-pour">${PERSONNES.map((p) => p.nom).concat(NOUS).map((n) => `<button type="button" data-epour="${esc(n)}" aria-pressed="${n === (l.pour || NOUS)}">${esc(n)}<small>${n === NOUS ? '½ chacun' : 'perso'}</small></button>`).join('')}</div></div>
      <label class="field"><span>Note (détail, source du prix…)</span><textarea id="e-note" maxlength="1000">${esc(l.note || '')}</textarea></label>
      <div class="err-msg" id="e-err" role="alert"></div>
      <div class="btns">${id && !res ? `<button type="button" class="btn danger" data-act="ed-del">Supprimer</button>` : ''}<button class="btn primary" type="submit">Enregistrer</button></div>`);
    majLigneForm();
  }
  function lireLigneForm() {
    const pour = ($('#e-pour [aria-pressed="true"]') || {}).dataset;
    return {
      pays: $('#e-pays').value, cat: $('#e-cat').value, poste: $('#e-poste').value.trim(), etape: $('#e-etape').value.trim(),
      qte: parseNum($('#e-qte').value), prix: parseNum($('#e-prix').value), devise: $('#e-devise').value,
      date: $('#e-date').value || '', statut: $('#e-statut').value, pour: pour ? pour.epour : NOUS, note: $('#e-note').value.trim(),
    };
  }
  function majLigneForm() {
    if (!edLigne) return;
    const v = lireLigneForm(), e = etat();
    const hotel = v.cat === HOTEL;
    $('#e-etape-wrap').hidden = !hotel;
    $('#e-qte-lbl').textContent = hotel ? 'Nuits' : 'Qté';
    if (estReserve(edLigne)) { $('#e-impact').textContent = `= ${chf(edLigne.prevu)} (plafond − le reste)`; return; }
    const nouveau = v.statut === OPTION ? 0 : ((v.qte || 0) * (v.prix || 0)) / (e.taux[v.devise] || 1);
    const delta = nouveau - (edLigne.prevu || 0);
    const { total, reserve } = resumeBudget(e);
    const autres = total - reserve + delta; // toutes les lignes sauf la réserve, après le changement
    let txt = `= <b>${chf(nouveau)}</b> prévus${edLigne.id && Math.abs(delta) >= 1 ? ` (${delta > 0 ? '+' : '−'}${nf0.format(Math.abs(Math.round(delta)))})` : ''}`;
    if (e.plafond && Math.abs(delta) >= 1) {
      txt += autres > e.plafond + 0.5 ? ` · <span class="bad">réserve à 0, le total dépasse le plafond de ${chf(autres - e.plafond)}</span>` : ` · réserve après : <b>${chf(e.plafond - autres)}</b>`;
    }
    $('#e-impact').innerHTML = txt;
  }
  function enregistrerLigne() {
    const v = lireLigneForm(), l = edLigne;
    const err = (m) => { $('#e-err').textContent = m; };
    if (!v.poste) return err('Écris un poste (ex. « Hôtel Kyoto · 6 nuits »).');
    if (v.cat === HOTEL && !v.etape) return err('Pour un hôtel, indique l’étape (la ville).');
    if (!(v.qte >= 0) || !(v.prix >= 0)) return err('Quantité et prix : des nombres positifs (ex. 6 et 120).');
    if (!l.id) {
      pousser({ type: 'ligneAjout', ligne: Object.assign({ id: 'l-' + uid().replace(/[^\w-]/g, '').slice(0, 20) }, v) });
      fermerEdSheet(); toast('✓ Ligne ajoutée');
      return;
    }
    const champs = {};
    for (const k of Object.keys(v)) if (String(v[k] ?? '') !== String(l[k] ?? '')) champs[k] = v[k];
    if (estReserve(l)) ['pays', 'cat', 'qte', 'prix', 'devise'].forEach((k) => delete champs[k]);
    if (Object.keys(champs).length) { pousser({ type: 'ligne', id: l.id, champs }); toast('✓ Ligne modifiée'); }
    fermerEdSheet();
  }

  function ouvrirPays(nom) {
    const e = etat();
    const p = nom ? e.pays.find((x) => x.nom === nom) : { nom: '', debut: '', fin: '', dev: 'CHF', c: '#9A9ABF' };
    if (!p) return;
    edPays = Object.assign({ nouveau: !nom }, p);
    const gen = p.nom === GENERAL;
    const nLignes = e.lignes.filter((l) => l.pays === p.nom).length;
    ouvrirEdSheet(`<h3>${nom ? esc(nom) : 'Nouveau pays'} <button type="button" class="icon-btn" data-act="ed-close" aria-label="Fermer">✕</button></h3>
      <label class="field"><span>Nom</span><input type="text" id="p-nom" maxlength="40" value="${esc(p.nom)}" ${gen ? 'disabled' : ''} placeholder="ex. Laos"></label>
      ${gen ? '' : `<div class="two">
        <label class="field"><span>1re nuit</span><input type="date" id="p-debut" value="${esc(p.debut || '')}"></label>
        <label class="field"><span>Dernière nuit</span><input type="date" id="p-fin" value="${esc(p.fin || '')}"></label>
      </div><div class="impact" id="p-nuits"></div>`}
      <div class="two">
        <label class="field"><span>Devise</span><select id="p-dev">${Object.keys(e.taux).map((d) => `<option ${d === p.dev ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select></label>
        <label class="field"><span>Couleur</span><input type="color" id="p-c" value="${esc(/^#[0-9a-f]{6}$/i.test(p.c) ? p.c : '#9A9ABF')}"></label>
      </div>
      ${nom && !gen ? `<p class="foot" style="margin:0 0 12px">${nLignes} ligne${nLignes > 1 ? 's' : ''} de budget · renommer met aussi à jour les lignes et les dépenses.</p>` : ''}
      <div class="err-msg" id="p-err" role="alert"></div>
      <div class="btns">${nom && !gen ? `<button type="button" class="btn danger" data-act="pays-del">Supprimer</button>` : ''}<button class="btn primary" type="submit">Enregistrer</button></div>`);
    majPaysForm();
  }
  function majPaysForm() {
    const d = $('#p-debut'), f = $('#p-fin');
    if (!d || !f || !$('#p-nuits')) return;
    $('#p-nuits').textContent = d.value && f.value && f.value >= d.value ? `${dayDiff(d.value, f.value) + 1} nuits` : 'Choisis la première et la dernière nuit.';
  }
  function enregistrerPays() {
    const p = edPays, e = etat();
    const err = (m) => { $('#p-err').textContent = m; };
    const nom = $('#p-nom').value.trim(), dev = $('#p-dev').value, c = $('#p-c').value;
    const debut = $('#p-debut') ? $('#p-debut').value : '', fin = $('#p-fin') ? $('#p-fin').value : '';
    if (p.nom !== GENERAL) {
      if (!nom) return err('Donne un nom au pays.');
      if (!debut || !fin || fin < debut) return err('Choisis la première et la dernière nuit (dans l’ordre).');
      if (nom !== p.nom && e.pays.some((x) => x.nom === nom)) return err('Ce nom existe déjà.');
    }
    if (p.nouveau) { pousser({ type: 'paysAjout', pays: { nom, debut, fin, devise: dev, couleur: c } }); fermerEdSheet(); toast('✓ Pays ajouté'); return; }
    const champs = {};
    if (p.nom !== GENERAL && nom !== p.nom) champs.nom = nom;
    if (debut !== (p.debut || '')) champs.debut = debut;
    if (fin !== (p.fin || '')) champs.fin = fin;
    if (dev !== p.dev) champs.devise = dev;
    if (c.toLowerCase() !== String(p.c).toLowerCase()) champs.couleur = c;
    if (Object.keys(champs).length) {
      if (p.nom !== GENERAL && !('debut' in champs) && !('fin' in champs)) { champs.debut = debut; champs.fin = fin; }
      pousser({ type: 'pays', nom: p.nom, champs });
      if (champs.nom && ui.edPays === p.nom) { ui.edPays = champs.nom; save(K.ui, ui); }
      toast('✓ Pays modifié');
    }
    fermerEdSheet();
  }

  async function tauxDuJour() {
    try {
      const r = await fetch('https://open.er-api.com/v6/latest/CHF').then((x) => x.json());
      if (!r || !r.rates) throw new Error();
      document.querySelectorAll('[data-taux]').forEach((i) => {
        const v = r.rates[i.dataset.taux];
        if (v) i.value = v >= 100 ? Math.round(v * 10) / 10 : Math.round(v * 10000) / 10000;
      });
      toast('Taux du jour chargés : vérifie puis « Enregistrer ».');
    } catch (e) { toast('Impossible de charger les taux (pas de réseau ?).'); }
  }
  function enregistrerTaux() {
    const t = etat().taux, valeurs = {};
    document.querySelectorAll('[data-taux]').forEach((i) => {
      const v = parseNum(i.value);
      if (v > 0 && Math.abs(v - t[i.dataset.taux]) > 1e-9) valeurs[i.dataset.taux] = v;
    });
    if (!Object.keys(valeurs).length) { toast('Aucun taux modifié.'); return; }
    pousser({ type: 'taux', valeurs });
    toast('✓ Taux enregistrés');
  }
  function enregistrerPlafond() {
    const v = parseNum($('#pl-val').value);
    if (!(v > 0)) { toast('Entre un plafond (ex. 30000).'); return; }
    if (v === etat().plafond) { toast('Plafond inchangé.'); return; }
    pousser({ type: 'reglages', plafond: Math.round(v) });
    toast('✓ Plafond enregistré');
  }

  $('#ed-sheet').addEventListener('submit', (ev) => { ev.preventDefault(); if (edLigne) enregistrerLigne(); else if (edPays) enregistrerPays(); });
  $('#ed-sheet').addEventListener('input', () => { if (edLigne) majLigneForm(); else majPaysForm(); });
  $('#ed-sheet').addEventListener('change', () => { if (edLigne) majLigneForm(); else majPaysForm(); });
  $('#ed-sheet').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-epour]');
    if (b) { document.querySelectorAll('#e-pour [data-epour]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); return; }
    const a = ev.target.closest('[data-act]');
    if (!a) return;
    if (a.dataset.act === 'ed-close') fermerEdSheet();
    else if (a.dataset.act === 'ed-del' || a.dataset.act === 'pays-del') {
      if (!edConfirm) { edConfirm = true; a.textContent = 'Confirmer'; return; }
      if (a.dataset.act === 'ed-del') { pousser({ type: 'ligneSuppr', id: edLigne.id }); toast('Ligne supprimée.'); }
      else {
        if (etat().lignes.some((l) => l.pays === edPays.nom)) { $('#p-err').textContent = 'Supprime d’abord les lignes de budget de ce pays.'; return; }
        pousser({ type: 'paysSuppr', nom: edPays.nom }); toast('Pays supprimé.');
      }
      fermerEdSheet();
    }
  });

  // ── Accueil / réglages ──
  function setupHtml() {
    return `<form class="setup" id="setup">
      <h1>Bienvenue 👋</h1>
      <p>Deux infos, une seule fois sur ce téléphone. Ensuite tout se synchronise avec le Google Sheet, même après un passage hors connexion.</p>
      <label class="field"><span>C’est le téléphone de…</span><select id="s-qui">${PERSONNES.map((p) => `<option ${moi() && moi().nom === p.nom ? 'selected' : ''}>${esc(p.nom)}</option>`).join('')}</select></label>

      <div class="err-msg" id="s-err"></div>
      <button class="btn primary wide" type="submit">Commencer</button>
      ${cfg && cfg.api ? `<p style="margin-top:16px">Pour installer l’appli sur un autre téléphone, envoie-lui ce lien (en privé : il donne accès au budget) :</p><button class="btn wide" type="button" id="s-share">Copier le lien d’installation</button>` : ''}
    </form>`;
  }
  function bindSetup() {
    $('#setup').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const qui = $('#s-qui').value.trim(), api = $('#s-api').value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(api)) { $('#s-err').textContent = 'Le lien doit commencer par https://script.google.com/'; return; }
      const changed = !cfg || cfg.api !== api;
      cfg = { api, qui };
      save(K.cfg, cfg);
      if (changed) { snap = null; save(K.snap, null); }
      render(); sync();
    });
    const sh = $('#s-share');
    if (sh) sh.addEventListener('click', () => copy(location.origin + location.pathname + '#api=' + encodeURIComponent(cfg.api)));
  }
  function copy(text) {
    const done = () => toast('Lien copié. Envoie-le à ton/ta partenaire en message privé.');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => prompt('Copie ce lien :', text));
    else prompt('Copie ce lien :', text);
  }

  // ── Synchronisation ──
  let syncAgain = false;
  async function sync() {
    if (!cfg || !cfg.api) return;
    if (syncing) { syncAgain = true; return; } // relancée dès la fin de la synchro en cours
    if (!navigator.onLine) { renderSync(); return; }
    syncing = true; lastError = ''; renderSync();
    try {
      let data = null;
      if (queue.length) {
        const ops = queue.slice();
        const res = await fetchJson(cfg.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ops }) });
        if (!res.ok) throw new Error(res.erreur || 'Le Google Sheet a refusé l’envoi.');
        const key = (o) => (EDITS.includes(o.type) ? 'edit:' + o.oid : o.type + ':' + (o.type === 'add' ? o.entry.id : o.id));
        const done = new Set([
          ...(res.ajoutes || []).map((id) => 'add:' + id), ...(res.annules || []).map((id) => 'cancel:' + id), ...(res.payes || []).map((id) => 'pay:' + id),
          ...(res.ignores || []).filter(Boolean).flatMap((id) => ['add:' + id, 'cancel:' + id, 'pay:' + id]),
          ...(res.edites || []).map((oid) => 'edit:' + oid),
        ]);
        (res.erreurs || []).forEach((x) => toast('Modification refusée : ' + x.erreur));
        if ((res.ignores || []).length) toast('Une saisie invalide a été ignorée par le Google Sheet.');
        queue = queue.filter((o) => !done.has(key(o)));
        save(K.queue, queue);
        if (res.data) data = Object.assign({ ok: true }, res.data);
      }
      if (!data) data = await fetchJson(cfg.api + (cfg.api.includes('?') ? '&' : '?') + 't=' + Date.now());
      if (!data.ok) throw new Error('Réponse inattendue du Google Sheet.');
      snap = { lignes: data.lignes, taux: data.taux, journal: data.journal, maj: data.maj };
      save(K.snap, snap);
    } catch (e) {
      lastError = e && e.message ? e.message : 'Synchro impossible';
    } finally {
      syncing = false;
      render();
      if (syncAgain) { syncAgain = false; if (!lastError) sync(); }
    }
  }
  async function fetchJson(url, opts) {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 60000);
    try {
      const r = await fetch(url, Object.assign({ redirect: 'follow', signal: ctl.signal }, opts));
      if (!r.ok) throw new Error('Erreur ' + r.status + ' du Google Sheet.');
      const txt = await r.text();
      try { return JSON.parse(txt); } catch (e) { throw new Error('Le lien ne répond pas comme prévu : vérifie qu’il se termine par /exec et que l’accès est « Tout le monde ».'); }
    } finally { clearTimeout(to); }
  }

  // ── Saisie ──
  let fCat = CATS[2].k, fPour = NOUS, fPourChoisi = false; // « Pour qui » : suit la catégorie tant qu'on ne l'a pas touché
  function openSheet() {
    const sel = ui.pays && ui.pays !== 'Tout' ? ui.pays : currentPays();
    const pays = sel === 'Tout' ? 'Général' : sel;
    $('#f-pays').innerHTML = paysL().map((p) => `<option ${p.nom === pays ? 'selected' : ''}>${esc(p.nom)}</option>`).join('');
    $('#f-devise').innerHTML = DEVISES.map((d) => `<option ${d === paysMeta(pays).dev ? 'selected' : ''}>${d}</option>`).join('');
    $('#f-date').value = today();
    $('#f-montant').value = ''; $('#f-libelle').value = ''; $('#f-err').textContent = ''; $('#f-resv').checked = false;
    fCat = CATS[2].k; fPourChoisi = false;
    renderCats(); fillEtapes(); conv();
    $('#sheet').hidden = false; $('#sheet-bg').hidden = false;
    setTimeout(() => $('#f-montant').focus(), 60);
  }
  function closeSheet() { $('#sheet').hidden = true; $('#sheet-bg').hidden = true; }
  function renderCats() {
    $('#f-cats').innerHTML = CATS.map((c) => `<button type="button" class="cat" data-cat="${esc(c.k)}" aria-pressed="${c.k === fCat}"><b>${c.ico}</b>${esc(c.court)}</button>`).join('');
    $('#f-libelle').placeholder = catMeta(fCat).ex || '';
    $('#f-etape-wrap').hidden = fCat !== HOTEL;
    $('#f-resv-wrap').hidden = fCat !== HOTEL;
    imprevuHint();
    if (!fPourChoisi) fPour = CATS_PERSO.includes(fCat) && moi() ? moi().nom : NOUS;
    renderPour();
  }
  function renderPour() {
    $('#f-pour').innerHTML = PERSONNES.map((p) => p.nom).concat(NOUS).map((n) => `<button type="button" data-pour="${esc(n)}" aria-pressed="${n === fPour}">${esc(n)}<small>${n === NOUS ? '½ chacun' : n === (moi() && moi().nom) ? 'moi' : 'perso'}</small></button>`).join('');
  }
  /** Imprévu : le pays choisi dit où il a eu lieu, mais la dépense va sur « Général » (la réserve). */
  function imprevuHint() {
    const on = fCat === IMPREVU, pays = $('#f-pays').value;
    $('#f-pays-lbl').textContent = on ? 'Où ?' : 'Pays';
    $('#f-imprevu').hidden = !on;
    if (on) $('#f-imprevu').innerHTML = `🛟 Déduit de la <b>réserve imprévus</b> (budget Général)${pays !== 'Général' ? ` · noté « ${esc(($('#f-libelle').value.trim() || 'Imprévu') + ' · ' + pays)} »` : ''}`;
  }
  function fillEtapes() {
    const pays = $('#f-pays').value;
    const hs = etat().lignes.filter((l) => l.pays === pays && l.cat === HOTEL);
    const cur = currentHotelEtape(pays);
    $('#f-etape').innerHTML = hs.length
      ? hs.map((l) => `<option value="${esc(l.etape)}" ${l.etape === cur ? 'selected' : ''}>${esc(l.etape)} · ${dateTxt(l.date)} · ${l.qte} nuit${l.qte > 1 ? 's' : ''}</option>`).join('')
      : `<option value="">Aucun hôtel prévu dans ce pays</option>`;
  }
  function conv() {
    const v = parseNum($('#f-montant').value), d = $('#f-devise').value;
    $('#f-conv').textContent = v > 0 && d !== 'CHF' ? `≈ ${nf2.format(toChf(v, d))} CHF` : '';
  }
  $('#sheet').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const montant = parseNum($('#f-montant').value);
    if (!(montant > 0)) { $('#f-err').textContent = 'Entre un montant (ex. 1250 ou 12,50).'; $('#f-montant').focus(); return; }
    const paysJour = $('#f-pays').value;
    const etape = fCat === HOTEL ? $('#f-etape').value : '';
    if (fCat === HOTEL && !etape) { $('#f-err').textContent = 'Choisis l’étape de l’hôtel (ou une autre catégorie).'; return; }
    let pays = paysJour, libelle = $('#f-libelle').value.trim();
    if (fCat === IMPREVU && paysJour !== 'Général') { libelle = `${libelle || 'Imprévu'} · ${paysJour}`; pays = 'Général'; }
    const resv = fCat === HOTEL && $('#f-resv').checked;
    const entry = {
      id: uid(), saisi: new Date().toISOString(), date: $('#f-date').value || today(), pays, cat: fCat, etape,
      libelle, montant: Math.round(montant * 100) / 100, devise: $('#f-devise').value, qui: fPour,
      statut: resv ? RESV : 'ok',
    };
    queue.push({ type: 'add', entry });
    if (!save(K.queue, queue)) toast('Attention : stockage du téléphone indisponible, synchronise vite.');
    closeSheet();
    ui.pays = paysJour; save(K.ui, ui);
    render();
    const quoi = fCat === IMPREVU ? 'déduits de la réserve' : resv ? 'réservés, à payer sur place' : 'enregistrés';
    toast(`${catMeta(fCat).ico} ${chf(toChf(entry.montant, entry.devise))} ${quoi}${navigator.onLine ? '' : ' · envoi au retour du réseau'}`);
    sync();
  });
  $('#f-cats').addEventListener('click', (ev) => { const b = ev.target.closest('[data-cat]'); if (!b) return; fCat = b.dataset.cat; renderCats(); });
  $('#f-pour').addEventListener('click', (ev) => { const b = ev.target.closest('[data-pour]'); if (!b) return; fPour = b.dataset.pour; fPourChoisi = true; renderPour(); });
  $('#f-pays').addEventListener('change', () => { $('#f-devise').value = paysMeta($('#f-pays').value).dev; fillEtapes(); conv(); imprevuHint(); });
  $('#f-libelle').addEventListener('input', () => { if (fCat === IMPREVU) imprevuHint(); });
  $('#f-montant').addEventListener('input', conv);
  $('#f-devise').addEventListener('change', conv);
  $('#close-sheet').addEventListener('click', closeSheet);
  $('#sheet-bg').addEventListener('click', () => { closeSheet(); fermerEdSheet(); });
  $('#fab').addEventListener('click', openSheet);

  // ── Interactions de la page ──
  document.addEventListener('click', (ev) => {
    const p = ev.target.closest('[data-pays]');
    if (p) { ui.pays = p.dataset.pays; ui.showAll = false; save(K.ui, ui); openEntry = null; render(); return; }
    const en = ev.target.closest('[data-entry]');
    if (en) { openEntry = openEntry === en.dataset.entry ? null : en.dataset.entry; confirmId = null; render(); return; }
    const c = ev.target.closest('[data-cancel]');
    if (c) {
      const id = c.dataset.cancel;
      if (confirmId !== id) { confirmId = id; render(); return; }
      const i = queue.findIndex((o) => o.type === 'add' && o.entry.id === id);
      if (i >= 0) queue.splice(i, 1); else queue.push({ type: 'cancel', id });
      save(K.queue, queue);
      openEntry = null; confirmId = null;
      render(); toast('Dépense annulée.'); sync();
      return;
    }
    const pay = ev.target.closest('[data-pay]');
    if (pay) {
      const id = pay.dataset.pay;
      const q = queue.find((o) => o.type === 'add' && o.entry.id === id);
      if (q) q.entry.statut = 'ok'; else queue.push({ type: 'pay', id }); // pas encore envoyée : on corrige la saisie
      save(K.queue, queue);
      openEntry = null; confirmId = null;
      render(); toast('✓ Hôtel marqué comme payé.'); sync();
      return;
    }
    const t = ev.target.closest('[data-edtab]');
    if (t) { ui.edTab = t.dataset.edtab; save(K.ui, ui); render(); return; }
    const ep = ev.target.closest('[data-edpays]');
    if (ep) { ui.edPays = ep.dataset.edpays; save(K.ui, ui); render(); return; }
    const el = ev.target.closest('[data-edl]');
    if (el) { ouvrirLigne(el.dataset.edl); return; }
    const epy = ev.target.closest('[data-edp]');
    if (epy) { ouvrirPays(epy.dataset.edp); return; }
    const a = ev.target.closest('[data-act]');
    if (a && a.dataset.act === 'edit-close') { ui.edit = false; save(K.ui, ui); render(); return; }
    if (a && a.dataset.act === 'ed-add') { ouvrirLigne(null); return; }
    if (a && a.dataset.act === 'pays-add') { ouvrirPays(null); return; }
    if (a && a.dataset.act === 'taux-jour') { tauxDuJour(); return; }
    if (a && a.dataset.act === 'taux-save') { enregistrerTaux(); return; }
    if (a && a.dataset.act === 'pl-save') { enregistrerPlafond(); return; }
    if (a && a.dataset.act === 'all') { ui.showAll = true; render(); return; }
    if (a && a.dataset.act === 'sync') { sync(); return; }
  });
  $('#sync').addEventListener('click', () => sync());
  $('#open-edit').addEventListener('click', () => { if (!snap) return; ui.edit = !ui.edit; save(K.ui, ui); window.scrollTo(0, 0); render(); });
  $('#open-settings').addEventListener('click', () => { $('#fab').hidden = true; $('#app').innerHTML = setupHtml(); bindSetup(); });

  let toastT = 0;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3500); }
  const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

  // ── Démarrage ──
  window.addEventListener('online', () => sync());
  window.addEventListener('offline', renderSync);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
  setInterval(() => { if (document.visibilityState === 'visible' && queue.length) sync(); }, 60000);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
  sync();
})();
</script>
</body>
</html>
